# Stage-2 Quality-Gated + Semantic-Embedding GRPO on SunflowerASR-51.
# Optimizes composite sequence-level reward:
#   R = 1.0 - (0.70 * WER + 0.30 * CER) + 0.15 * GlossaryF1 + 0.20 * EmbeddingCosine - 0.20 * LengthPenalty
# Features:
#   - Automatic dataset QC (glued-punctuation repair + speech-rate outlier filtering + CSV/JSON audit reports)
#   - Quality gating: skips corrupted/swapped references (greedy_wer > 0.85 & greedy_cer > 0.45) and trivial
#     zero-variance clips so 100% of optimizer steps occur on learnable examples
#   - Semantic embedding reward via google/embeddinggemma-300m (with intfloat/multilingual-e5-base fallback)
#
# Run:
#   ndizi-asr-train --config configs/train_sunbird51_ndizi_grpo.yaml --dry-run
#   ndizi-asr-train --config configs/train_sunbird51_ndizi_grpo.yaml

dataset_id: smutuvi/ndizi-1-sw
experiment_name: sunflower51_ndizi1sw_grpo_qgate_sem
backend: whisper_grpo
model_id: outputs/sunflower51_ndizi1sw_lora/merged
language: swahili
audio_column: audio
text_column: transcript
split: train
eval_split: validation
output_dir: outputs
num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.5e-5
warmup_ratio: 0.05
fp16: true
logging_steps: 20
save_steps: 200
max_steps: 600
lora: true

extra:
  stage: grpo
  dataset_ids:
    - smutuvi/ndizi-1-sw
  apply_data_qc: true
  chunk_long_audio: false
  min_chars_per_sec: 2.5
  max_chars_per_sec: 26.0
  max_input_seconds: 30
  label_max_length: 448
  group_size: 6
  temperature: 0.80
  top_p: 0.95
  kl_beta: 0.04
  sft_anchor_weight: 0.15
  wer_weight: 0.70
  cer_weight: 0.30
  glossary_weight: 0.15
  length_penalty_weight: 0.20
  semantic_reward_weight: 0.20
  semantic_model_id: google/embeddinggemma-300m
  semantic_fallback_model_id: intfloat/multilingual-e5-base
  quality_gate: true
  min_learnable_wer: 0.04
  max_learnable_wer: 0.85
  max_corrupted_cer: 0.45
  max_new_tokens: 200
  max_eval_samples: 256
  eval_every_steps: 200
  save_merged: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - out_proj
    - fc1
    - fc2
