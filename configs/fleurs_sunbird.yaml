# FLEURS evaluation for Sunbird Whisper-51 (local Hugging Face checkpoint).
experiment_name: fleurs_sunbird_whisper51

models:
  - Sunbird/asr-whisper-51-african-languages

dataset:
  type: fleurs
  dataset_id: google/fleurs
  split: test
  languages:
    swahili: sw_ke
    amharic: am_et
    oromo: om_et
    hausa: ha_ng
  audio_column: audio
  text_column: transcription
  max_samples: null
  streaming: false

# Used only for OpenRouter models; safe to leave when running local-only.
openrouter:
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 120
  max_retries: 5
  retry_backoff_seconds: 2.0
  temperature: 0.0
  max_tokens: 1024

local_whisper:
  device: null          # null=auto (cuda → mps → cpu)
  torch_dtype: auto     # auto|float16|bfloat16|float32
  num_beams: 1
  concurrency: 1

prompt: >
  Transcribe the speech in this audio exactly.
  Return only the transcript text with no commentary, labels, or punctuation
  beyond what is spoken. Preserve the original language of the audio.

normalization:
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

concurrency: 1
output_dir: results
resume: true
save_every: 20
