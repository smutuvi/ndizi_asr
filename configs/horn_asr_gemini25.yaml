# Gemini 2.5 Flash on LesanAI Horn-ASR (Amharic + Oromo).
# Spontaneous interview speech; 1,000 test utts per language.
experiment_name: horn_asr_gemini25_n100

models:
  - google/gemini-2.5-flash

dataset:
  type: huggingface
  split: test
  max_samples: 100
  streaming: true
  sources:
    - dataset_id: LesanAI/Horn-ASR
      config_name: am
      split: test
      language: amharic
      audio_column: file_name
      text_column: transcript
      id_column: utterance_id
    - dataset_id: LesanAI/Horn-ASR
      config_name: om
      split: test
      language: oromo
      audio_column: file_name
      text_column: transcript
      id_column: utterance_id

openrouter:
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 120
  max_retries: 5
  retry_backoff_seconds: 2.0
  temperature: 0.0
  max_tokens: 1024

prompt: >
  Transcribe the speech in this audio exactly.
  Return only the transcript text with no commentary, labels, or punctuation
  beyond what is spoken. Preserve the original language of the audio.

normalization:
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

concurrency: 4
output_dir: results
resume: true
save_every: 20
