# Smart fusion on Ndizi Swahili (smutuvi/ndizi-1-sw test split, n=1,036).
# ASR: smutuvi/ndizi-whisper-large-v3-turbo-optimized + Sunbird/SunflowerASR-51-african-languages + badrex/w2v-bert-2.0-swahili-asr
# Editor: google/gemini-4-argon (OpenRouter)
experiment_name: llm_fusion_ndizi1sw_argon_fs8

dataset:
  type: huggingface
  language: swahili
  split: test
  audio_column: audio
  text_column: transcript
  streaming: false
  sources:
    - dataset_id: smutuvi/ndizi-1-sw
      split: test
      language: swahili
      audio_column: audio
      text_column: transcript

openrouter:
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 120
  max_retries: 5
  retry_backoff_seconds: 2.0
  temperature: 0.0
  max_tokens: 1024

normalization:
  mode: default
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

output_dir: results
resume: true
