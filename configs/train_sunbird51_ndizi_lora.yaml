# Sunbird Whisper-51 LoRA on Ndizi farm-interview Swahili.
# Train:
#   pip install -e ".[train]"
#   ndizi-asr-train --config configs/train_sunbird51_ndizi_lora.yaml --dry-run
#   ndizi-asr-train --config configs/train_sunbird51_ndizi_lora.yaml

experiment_name: sunbird51_ndizi_lora
backend: whisper
model_id: Sunbird/asr-whisper-51-african-languages
language: swahili
audio_column: audio
text_column: text
split: train
eval_split: validation
output_dir: outputs
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
warmup_ratio: 0.05
fp16: true
logging_steps: 25
save_steps: 500
lora: true

extra:
  dataset_ids:
    - smutuvi/ndizi-1
    - smutuvi/ndizi-1-2025
  max_input_seconds: 30
  label_max_length: 448
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - out_proj
    - fc1
    - fc2
  gradient_checkpointing: true
  save_total_limit: 2
  per_device_eval_batch_size: 4
  dataloader_num_workers: 2
