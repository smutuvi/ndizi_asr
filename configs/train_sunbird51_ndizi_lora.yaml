# SunflowerASR-51 LoRA fine-tuning on smutuvi/ndizi-1-sw (Ndizi Farmer Feedback Speech).
# Train:
#   pip install -e ".[train]"
#   ndizi-asr-train --config configs/train_sunbird51_ndizi_lora.yaml --dry-run
#   ndizi-asr-train --config configs/train_sunbird51_ndizi_lora.yaml

dataset_id: smutuvi/ndizi-1-sw
experiment_name: sunflower51_ndizi1sw_lora
backend: whisper
model_id: Sunbird/SunflowerASR-51-african-languages
language: swahili
audio_column: audio
text_column: transcript
split: train
eval_split: validation
output_dir: outputs
num_train_epochs: 5
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
warmup_ratio: 0.08
fp16: true
logging_steps: 25
save_steps: 500
lora: true

extra:
  dataset_ids:
    - smutuvi/ndizi-1-sw
  max_input_seconds: 30
  label_max_length: 448
  freeze_encoder: true
  label_smoothing_factor: 0.05
  lr_scheduler_type: cosine
  save_merged: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - out_proj
    - fc1
    - fc2
  gradient_checkpointing: true
  save_total_limit: 2
  per_device_eval_batch_size: 4
  dataloader_num_workers: 2
