# Arabic ASR smoke: FLEURS + Common Voice + MGB-2 + MGB-3 (400 clips per source).
experiment_name: arabic_eval_n400

models:
  - google/gemini-2.5-flash
  - google/gemini-3.1-flash-lite
  - google/gemini-3.5-flash
  - google/gemini-3.6-flash

dataset:
  type: huggingface
  language: arabic
  split: test
  max_samples: 400
  streaming: false
  sources:
    # Read Egyptian (benchmark)
    - dataset_id: google/fleurs
      config_name: ar_eg
      split: test
      language: arabic
      audio_column: audio
      text_column: transcription
    # Multi-dialect read speech
    - dataset_id: MohamedRashad/common-voice-18-arabic
      split: test
      language: arabic
      audio_column: audio
      text_column: sentence
    # Broadcast multi-dialect (non-verbatim refs; compare models relatively)
    - dataset_id: Esra11/mgb2-arabic
      split: train
      language: arabic
      audio_column: audio
      text_column: transcript
    # Egyptian YouTube/broadcast (manual transcripts)
    - dataset_id: MightyStudent/Egyptian-ASR-MGB-3
      split: train
      language: arabic
      audio_column: audio
      text_column: sentence

openrouter:
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 120
  max_retries: 5
  retry_backoff_seconds: 2.0
  temperature: 0.0
  max_tokens: 1024

prompt: >
  Transcribe the speech in this audio exactly.
  Return only the transcript text with no commentary, labels, or punctuation
  beyond what is spoken. Preserve the original language of the audio.

normalization:
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

concurrency: 4
output_dir: results
resume: true
save_every: 20
