# Evaluate smutuvi/ndizi-whisper-large-v3-turbo-optimized and Sunbird/SunflowerASR-51-african-languages
# on the smutuvi/ndizi-1-sw held-out test split (n=1,036).
experiment_name: ndizi1sw_baseline_vs_sunflower

models:
  - smutuvi/ndizi-whisper-large-v3-turbo-optimized
  - Sunbird/SunflowerASR-51-african-languages

dataset:
  type: huggingface
  language: swahili
  split: test
  audio_column: audio
  text_column: transcript
  max_samples: null
  streaming: true
  sources:
    - dataset_id: smutuvi/ndizi-1-sw
      split: test
      language: swahili
      audio_column: audio
      text_column: transcript

local_whisper:
  device: null
  torch_dtype: auto
  num_beams: 1
  concurrency: 1

normalization:
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

concurrency: 1
output_dir: results
resume: true
save_every: 20
