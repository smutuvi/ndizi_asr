# Evaluate smutuvi/ndizi-whisper-large-v3-turbo-optimized on Ndizi Swahili test sets.
experiment_name: ndizi_whisper_turbo_optimized_eval

models:
  - smutuvi/ndizi-whisper-large-v3-turbo-optimized

dataset:
  type: huggingface
  language: swahili
  split: test
  audio_column: audio
  text_column: text
  max_samples: null
  streaming: false
  sources:
    - dataset_id: smutuvi/ndizi-1
      split: test
      language: swahili
    - dataset_id: smutuvi/ndizi-1-2025
      split: test
      language: swahili

local_whisper:
  device: null
  torch_dtype: auto
  num_beams: 1
  concurrency: 1

normalization:
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

concurrency: 1
output_dir: results
resume: true
save_every: 20
