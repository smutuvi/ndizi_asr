# Default FLEURS evaluation for African languages via OpenRouter Gemini models.
experiment_name: fleurs_afro_gemini

models:
  - google/gemini-2.5-flash
  - google/gemini-3-flash-preview
  - google/gemini-3.5-flash

# Dataset selector: fleurs | huggingface
dataset:
  type: fleurs
  # HF dataset id (overridable for custom mirrors)
  dataset_id: google/fleurs
  split: test
  # Friendly language keys → FLEURS config names
  languages:
    swahili: sw_ke
    amharic: am_et
    oromo: om_et
    hausa: ha_ng
  # Column mapping (FLEURS defaults)
  audio_column: audio
  text_column: transcription
  # Optional: limit samples per language (null = all)
  max_samples: null
  streaming: false

openrouter:
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 120
  max_retries: 5
  retry_backoff_seconds: 2.0
  temperature: 0.0
  max_tokens: 1024

prompt: >
  Transcribe the speech in this audio exactly.
  Return only the transcript text with no commentary, labels, or punctuation
  beyond what is spoken. Preserve the original language of the audio.

normalization:
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

concurrency: 4
output_dir: results
resume: true
save_every: 20
