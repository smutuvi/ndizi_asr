# Compare Gemini 2.5 Flash (OpenRouter) vs Sunbird Whisper-51 (local)
# on Ndizi Swahili ASR datasets.
experiment_name: ndizi_gemini25_vs_sunbird

models:
  - google/gemini-2.5-flash
  - Sunbird/asr-whisper-51-african-languages

dataset:
  type: huggingface
  language: swahili
  split: test
  audio_column: audio
  text_column: text
  max_samples: null
  streaming: false
  sources:
    - dataset_id: smutuvi/ndizi-1
      split: test
      language: swahili
    - dataset_id: smutuvi/ndizi-1-2025
      split: test
      language: swahili

openrouter:
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 120
  max_retries: 5
  retry_backoff_seconds: 2.0
  temperature: 0.0
  max_tokens: 1024

local_whisper:
  device: null
  torch_dtype: auto
  num_beams: 1
  concurrency: 1

prompt: >
  Transcribe the speech in this audio exactly.
  Return only the transcript text with no commentary, labels, or punctuation
  beyond what is spoken. Preserve the original language of the audio.

normalization:
  lowercase: true
  strip_punctuation: true
  collapse_whitespace: true

concurrency: 4
output_dir: results
resume: true
save_every: 20
