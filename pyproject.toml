[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ndizi-asr"
version = "0.2.0"
description = "Ndizi ASR — one-stop train and evaluate for African speech recognition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ndizi MLOps" }]
dependencies = [
  "datasets>=2.19.0",
  "soundfile>=0.12.1",
  "numpy>=1.24.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
  "jiwer>=3.0.0",
  "tqdm>=4.66.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
local = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "accelerate>=0.27.0",
  "torchaudio>=2.1.0",
  "silero-vad>=5.1",
  "librosa>=0.10.0",
]
omnilingual = [
  "omnilingual-asr[data]",
]
train = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "accelerate>=0.27.0",
  "datasets>=2.19.0",
  "evaluate>=0.4.1",
]
all = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "accelerate>=0.27.0",
  "torchaudio>=2.1.0",
  "silero-vad>=5.1",
  "librosa>=0.10.0",
  "omnilingual-asr[data]",
  "evaluate>=0.4.1",
  "pytest>=8.0.0",
]

[project.scripts]
ndizi-asr = "ndizi_asr.cli:main"
ndizi-asr-train = "ndizi_asr.train:main"
ndizi-asr-fuse = "ndizi_asr.ensemble:main"
ndizi-asr-glossary = "ndizi_asr.build_glossary:main"
# Back-compat
gemini-asr-bench = "ndizi_asr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ndizi_asr = ["py.typed"]
